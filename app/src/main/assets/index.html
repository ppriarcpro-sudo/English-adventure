<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>English Adventure 3</title><style>
:root{font-family:ui-rounded,'Trebuchet MS',system-ui,sans-serif;color:#23435c}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(160deg,#72d7f6 0%,#c2f2ff 48%,#b9eaa0 100%);overflow-x:hidden}body:before{content:'☁️                         ☁️                ☁️';position:fixed;top:4%;left:0;width:100%;font-size:40px;opacity:.75;pointer-events:none}.app{position:relative;max-width:1050px;margin:auto;padding:12px 16px 20px;min-height:100dvh}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:clamp(22px,4vw,37px);font-weight:1000;color:#20567c;text-shadow:0 2px white}.pill{background:#fff9;border:2px solid #fff;border-radius:40px;padding:8px 14px;font-weight:900}.layout{display:grid;grid-template-columns:minmax(175px,35%) 1fr;gap:16px;align-items:center;min-height:calc(100dvh - 95px)}.guide{text-align:center;align-self:center}.dino{width:min(100%,310px);max-height:320px;filter:drop-shadow(0 14px 6px #32745a33);animation:bob 2.6s ease-in-out infinite}.dino.happy{animation:jump .48s ease-in-out 2}.speech{background:#fff;border:4px solid #fff;border-radius:27px;padding:14px 18px;box-shadow:0 8px 0 #3796b855;font-weight:900;font-size:clamp(19px,2.7vw,28px);margin:0 auto;max-width:320px}.panel{background:#ffffffdf;border:3px solid #fff;border-radius:30px;padding:clamp(14px,2.5vw,28px);box-shadow:0 12px 0 #4c9e9b35}.subtitle{margin:6px 0 15px;font-size:clamp(16px,2vw,21px)}h1,h2{margin:0 0 12px;font-size:clamp(25px,3.2vw,36px)}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:4px solid #237ce0;outline-offset:3px}.world{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:white;border-radius:22px;padding:12px 16px;margin:10px 0;box-shadow:0 6px 0 #8ac8c2;font-size:clamp(17px,2.5vw,24px);font-weight:900;min-height:72px}.world .emoji{font-size:36px}.world small{display:block;font-size:13px;color:#6b8191}.world:active,.option:active,.action:active{transform:translateY(4px);box-shadow:0 2px 0 #8ac8c2}.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.option{background:white;border:4px solid #fff;border-radius:24px;min-height:clamp(110px,23vh,190px);font-size:clamp(54px,9vw,100px);box-shadow:0 7px 0 #8ac8c2}.option.wrong{background:#ffdfdc;border-color:#ffac9c;animation:shake .3s}.option.correct{background:#dcffcd;border-color:#6bd776}.option:disabled{opacity:.8}.action{border-radius:18px;background:#ffcd53;padding:12px 20px;box-shadow:0 5px 0 #d89e36;font-size:18px;font-weight:900}.muted{background:#e6f4fa;box-shadow:0 5px 0 #a9cbd6}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.status{font-weight:900;font-size:22px;min-height:35px;color:#247d66}.hidden{display:none!important}.stars{font-size:24px}.progress{height:14px;border-radius:50px;background:#d9e9ec;overflow:hidden;margin:8px 0 14px}.bar{height:100%;background:linear-gradient(90deg,#ffcb50,#ff8b66);width:0;transition:width .3s}.reward{text-align:center;font-size:clamp(50px,9vw,95px);margin:10px}.tiny{font-size:13px;color:#526d7d}.footer{font-size:12px;color:#416679;text-align:right}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.confetti span{position:absolute;top:-20px;animation:fall 1.5s linear forwards;font-size:25px}@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}@keyframes bob{50%{transform:translateY(-11px) rotate(2deg)}}@keyframes jump{50%{transform:translateY(-32px) rotate(-8deg)}}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:650px) and (orientation:portrait){.layout{display:block}.guide{display:flex;align-items:center;gap:10px;margin:10px auto}.dino{width:110px;height:125px}.speech{font-size:17px;flex:1}.option{min-height:120px;font-size:52px}.panel{padding:15px}}@media(max-height:500px) and (orientation:landscape){.app{padding:7px 12px}.layout{min-height:calc(100dvh - 53px)}.dino{max-height:175px}.speech{padding:9px;font-size:19px}.panel{padding:12px}.option{min-height:100px}.options{margin:10px 0}.world{min-height:56px;margin:7px 0;padding:6px 12px}.world .emoji{font-size:27px}h2{font-size:23px;margin-bottom:6px}}
@media (min-width:900px) and (orientation:landscape){.app{max-width:1400px;padding:16px 28px}.layout{grid-template-columns:36% 1fr;gap:30px}.dino{width:min(100%,360px);max-height:370px}.option{min-height:170px}.world{min-height:88px}.speech{max-width:380px}}@media (prefers-reduced-motion:reduce){.dino,.dino.happy{animation:none}} </style></head><body><div class="app"><header class="top"><div class="brand">🌟 English Adventure</div><div class="pill" id="badge">⭐ 0</div></header><div class="layout"><div class="guide"><svg id="dino" class="dino" viewBox="0 0 300 320" role="img" aria-label="Dino, el dragón amigo"><ellipse cx="150" cy="297" rx="93" ry="15" fill="#398a7650"/><path d="M225 220Q290 203 268 159Q255 190 217 178" fill="#39b77c" stroke="#258e63" stroke-width="5"/><path d="M88 105L72 54 113 76 139 32 160 76 205 45 205 110" fill="#76dc78" stroke="#258e63" stroke-width="5"/><ellipse cx="154" cy="183" rx="91" ry="110" fill="#42c88b" stroke="#258e63" stroke-width="6"/><ellipse cx="157" cy="219" rx="55" ry="65" fill="#b8f39d"/><path d="M88 184Q25 165 32 211Q47 240 96 221" fill="#39b77c" stroke="#258e63" stroke-width="5"/><path d="M219 183Q274 170 268 216Q248 239 211 223" fill="#39b77c" stroke="#258e63" stroke-width="5"/><ellipse cx="112" cy="141" rx="28" ry="34" fill="white"/><ellipse cx="191" cy="141" rx="28" ry="34" fill="white"/><ellipse cx="119" cy="145" rx="12" ry="18" fill="#23435c"/><ellipse cx="184" cy="145" rx="12" ry="18" fill="#23435c"/><circle cx="124" cy="138" r="5" fill="white"/><circle cx="189" cy="138" r="5" fill="white"/><ellipse cx="151" cy="181" rx="49" ry="33" fill="#78df91"/><circle cx="128" cy="178" r="5" fill="#258e63"/><circle cx="175" cy="178" r="5" fill="#258e63"/><path d="M129 196Q151 215 177 195" fill="none" stroke="#258e63" stroke-width="6" stroke-linecap="round"/><ellipse cx="92" cy="177" rx="13" ry="7" fill="#ff9d9d" opacity=".75"/><ellipse cx="213" cy="177" rx="13" ry="7" fill="#ff9d9d" opacity=".75"/><ellipse cx="111" cy="277" rx="31" ry="17" fill="#258e63"/><ellipse cx="205" cy="277" rx="31" ry="17" fill="#258e63"/></svg><div class="speech" id="speech">Hello, friend! 👋</div></div><main class="panel"><section id="menu"><h1>¡Vamos a jugar!</h1><p class="subtitle">Elige una aventura con Dino.</p><button class="world" data-world="animals"><span class="emoji">🌳</span><span>Animal Forest<small>Animales · 6 palabras</small></span></button><button class="world" data-world="colors"><span class="emoji">🌈</span><span>Rainbow Valley<small>Colores · 6 palabras</small></span></button><button class="world" data-world="numbers"><span class="emoji">🏝️</span><span>Number Island<small>Números · 10 palabras</small></span></button><p class="tiny">🔊 Pulsa un mundo para empezar. Dino te hablará en inglés.</p></section><section id="game" class="hidden"><div id="roundLabel" class="tiny"></div><div class="progress"><div id="bar" class="bar"></div></div><h2 id="prompt">Listen!</h2><div class="controls"><button class="action muted" id="listen">🔊 Escuchar</button><span id="status" class="status" aria-live="polite"></span></div><div class="options" id="options"></div><button class="action muted" id="back">🏠 Inicio</button></section><section id="finish" class="hidden"><h2>¡Misión completada!</h2><div class="reward">🏆🎉</div><p id="summary" class="subtitle"></p><div class="controls"><button class="action" id="again">🔁 Otra partida</button><button class="action muted" id="finishHome">🏠 Mundos</button></div></section></main></div><div class="footer">Sin anuncios · Sin cuentas · Funciona sin internet · Progreso guardado</div></div><div id="confetti" class="confetti"></div><script>
'use strict';const data={animals:[['dog','🐶'],['cat','🐱'],['lion','🦁'],['elephant','🐘'],['bird','🐦'],['fish','🐟']],colors:[['red','🔴'],['blue','🔵'],['green','🟢'],['yellow','🟡'],['pink','🩷'],['orange','🟠']],numbers:[['one','1️⃣'],['two','2️⃣'],['three','3️⃣'],['four','4️⃣'],['five','5️⃣'],['six','6️⃣'],['seven','7️⃣'],['eight','8️⃣'],['nine','9️⃣'],['ten','🔟']]};const $=id=>document.getElementById(id);let world='animals',round=0,score=0,queue=[],current=null,locked=false,token=0,mistakes=0;const KEY='english-adventure-v3';let progress;try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){progress={}};function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}}function total(){return Object.values(progress).reduce((a,x)=>a+(x.stars||0),0)}function updateBadge(){$('badge').textContent='⭐ '+total()}function show(id){['menu','game','finish'].forEach(s=>$(s).classList.toggle('hidden',s!==id))}function say(t){if(window.AndroidVoice && typeof window.AndroidVoice.speak==='function'){window.AndroidVoice.speak(t);return;}if(!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;u.pitch=1.15;speechSynthesis.speak(u)}catch(e){}}function speech(t){$('speech').textContent=t}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}function weightedQueue(w){let pool=data[w].map(item=>({item,weight:Math.max(1,5-(progress[w+':'+item[0]]?.mastery||0))}));let result=[];for(let i=0;i<5;i++){let sum=pool.reduce((a,p)=>a+p.weight,0),r=Math.random()*sum,selected=pool[0];for(const p of pool){r-=p.weight;if(r<=0){selected=p;break}}result.push(selected.item);pool=pool.filter(p=>p!==selected);if(!pool.length)break}return result}function start(w){token++;world=w;round=0;score=0;queue=weightedQueue(w);show('game');next()}function instruction(){return world==='animals'?'Find the '+current[0]+'!':world==='colors'?'Find '+current[0]+'!':'Find number '+current[0]+'!'}function next(){locked=false;mistakes=0;$('status').textContent='';if(round>=queue.length){finish();return}current=queue[round];$('roundLabel').textContent='Misión '+(round+1)+' de '+queue.length+' · ⭐ '+score;$('bar').style.width=(round/queue.length*100)+'%';$('prompt').textContent=instruction();speech('Listen carefully! 👂');let choices=shuffle([current,...shuffle(data[world].filter(x=>x[0]!==current[0])).slice(0,2)]);$('options').replaceChildren();for(const item of choices){let b=document.createElement('button');b.className='option';b.textContent=item[1];b.setAttribute('aria-label',item[0]);b.onclick=()=>choose(item[0],b);$('options').append(b)}let t=token;setTimeout(()=>{if(t===token&&!locked)say(instruction())},350)}function choose(word,btn){if(locked)return;if(word!==current[0]){mistakes++;btn.classList.add('wrong');speech('Try again! 💛');$('status').textContent='💛 Try again!';say('Try again!');setTimeout(()=>btn.classList.remove('wrong'),550);return}locked=true;btn.classList.add('correct');score++;let k=world+':'+current[0];let p=progress[k]||{mastery:0};p.mastery=Math.max(0,Math.min(5,p.mastery+(mistakes?-1:1)));progress[k]=p;save();speech('Amazing! ⭐');$('status').textContent='🌟 Great job!';$('dino').classList.remove('happy');void $('dino').getBoundingClientRect();$('dino').classList.add('happy');say('Great job!');let t=token;setTimeout(()=>{if(t===token){round++;next()}},1250)}function celebrate(){const c=$('confetti');c.replaceChildren();for(let i=0;i<32;i++){let s=document.createElement('span');s.textContent=['⭐','🎉','💛','✨'][i%4];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.65+'s';c.append(s)}setTimeout(()=>c.replaceChildren(),2600)}function finish(){show('finish');let p=progress[world]||{stars:0};p.stars=Math.max(p.stars,score);progress[world]=p;save();updateBadge();$('summary').textContent='¡Has ganado '+score+' de '+queue.length+' estrellas!';speech('Well done, explorer! 🎉');say('Amazing! Well done!');celebrate()}function home(){token++;if(window.AndroidVoice)window.AndroidVoice.stop();else if('speechSynthesis'in window)speechSynthesis.cancel();show('menu');speech('Hello, friend! 👋');updateBadge()}document.querySelectorAll('[data-world]').forEach(b=>b.onclick=()=>start(b.dataset.world));$('listen').onclick=()=>say(instruction());$('back').onclick=home;$('finishHome').onclick=home;$('again').onclick=()=>start(world);home();
</script></body></html>
