<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HeroQuest English 5</title>
<style>
:root{--ink:#243350;--gold:#ffd45c;--blue:#67d9ed}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Trebuchet MS',sans-serif;color:var(--ink);background:#8cdbed}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #fff;outline-offset:2px}.screen{display:none;position:relative;width:100vw;height:100dvh;overflow:hidden}.screen.active{display:flex;flex-direction:column}.sky{position:absolute;inset:0;background:linear-gradient(#5ec9f4 0%,#c1f5fa 55%,#b3edb0 55%,#6fc788 100%);pointer-events:none}.cloud{position:absolute;font-size:clamp(35px,7vw,90px);opacity:.8;animation:drift 24s linear infinite}.cloud:nth-child(2){top:8%;left:15%;animation-duration:33s}.cloud:nth-child(3){top:20%;left:65%;animation-duration:28s}@keyframes drift{from{transform:translateX(-15vw)}to{transform:translateX(115vw)}}.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:10px 18px;gap:10px}.logo{color:white;text-shadow:0 3px #3374a2,0 5px 12px #164c7d;font-weight:1000;font-size:clamp(19px,3.2vw,37px);letter-spacing:.5px}.pill{border:3px solid #fff;border-radius:30px;background:#ffffffdf;box-shadow:0 5px #4b90a066;padding:7px 16px;font-size:clamp(13px,1.8vw,21px);font-weight:1000}.btn{background:linear-gradient(#ffe58b,#ffc444);border:3px solid white;border-radius:20px;padding:10px 20px;font-size:clamp(15px,2vw,24px);font-weight:1000;color:#5c3a15;box-shadow:0 7px #ce8c38,0 10px 16px #2e698044;transition:transform .14s}.btn:active{transform:translateY(5px);box-shadow:0 2px #ce8c38}.btn.blue{background:linear-gradient(#c8f7ff,#66d5f0);color:#164b71;box-shadow:0 6px #2a9cb7}.heroSelect{position:relative;flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(20px,5vw,75px)}.welcome{max-width:47%;text-align:center;background:#ffffffe9;border:5px solid white;border-radius:36px;padding:clamp(15px,3vw,38px);box-shadow:0 15px 0 #357e8560;z-index:1}.welcome h1{font-size:clamp(25px,4vw,52px);margin:5px}.welcome p{font-size:clamp(15px,2vw,25px)}.heroes{display:flex;gap:12px}.heroBtn{background:#fff;border:5px solid #fff;border-radius:24px;box-shadow:0 7px #4e9c9c;font-size:clamp(35px,6vw,75px);padding:8px 18px}.heroBtn.selected{border-color:#ffc12f;transform:translateY(-6px)}.heroBtn small{display:block;font-size:clamp(12px,1.5vw,18px);font-weight:900}.mascot{position:relative;z-index:1;font-size:clamp(100px,20vw,260px);filter:drop-shadow(0 14px 5px #357b7180);animation:bounce 2.4s ease-in-out infinite}@keyframes bounce{50%{transform:translateY(-16px) rotate(3deg)}}.mapWrap{position:relative;flex:1;min-height:0;margin:0 14px 12px;border:6px solid #fff;border-radius:30px;overflow:hidden;box-shadow:inset 0 0 50px #fff8,0 8px 20px #205e7088;background:linear-gradient(150deg,#b4ec99,#72cf91 65%,#55b99a)}.mapArt{position:absolute;inset:0;width:100%;height:100%}.mapArt .river{animation:river 5s ease-in-out infinite alternate}@keyframes river{to{opacity:.65}}.mapArt .tree{animation:trees 3.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}@keyframes trees{to{transform:rotate(3deg)}}.node{position:absolute;z-index:3;transform:translate(-50%,-50%);border:4px solid #fff;border-radius:50%;width:clamp(64px,8.2vw,112px);height:clamp(64px,8.2vw,112px);background:radial-gradient(circle at 30% 20%,#fff4c1,#ffd35d);box-shadow:0 7px #ac833a,0 12px 12px #426b4e70;font-size:clamp(28px,4vw,52px);animation:float 2.6s ease-in-out infinite}.node:nth-of-type(even){animation-delay:-1.3s}@keyframes float{50%{transform:translate(-50%,-55%)}}.node small{display:block;font-size:clamp(10px,1.2vw,15px);font-weight:1000;color:#60451e}.node.locked{filter:grayscale(.8);opacity:.72}.walker{position:absolute;z-index:4;left:10%;top:76%;font-size:clamp(42px,6.5vw,92px);transform:translate(-50%,-50%);filter:drop-shadow(0 8px 3px #336b5777);transition:left 1.4s cubic-bezier(.25,.8,.3,1),top 1.4s cubic-bezier(.25,.8,.3,1)}.walker.walking{animation:walk .28s ease-in-out infinite alternate}@keyframes walk{to{transform:translate(-50%,-60%) rotate(8deg)}}.mapLabel{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);border:3px solid white;background:#ffffffe8;padding:8px 16px;border-radius:30px;font-size:clamp(12px,1.7vw,20px);font-weight:900;white-space:nowrap;z-index:5}.sparkle{position:absolute;pointer-events:none;font-size:24px;z-index:8;animation:pop 1.1s ease-out forwards}@keyframes pop{to{transform:translateY(-110px) rotate(80deg) scale(.4);opacity:0}}.gameBody{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:28% 72%;gap:8px;padding:0 18px 14px}.sidekick{display:flex;align-items:center;justify-content:center;flex-direction:column;min-height:0}.sideHero{font-size:clamp(75px,14vw,190px);animation:bounce 2s ease-in-out infinite;filter:drop-shadow(0 10px 5px #387e8370)}.bubble{background:white;border:4px solid #fff;border-radius:25px;padding:12px;box-shadow:0 7px #3d98a766;text-align:center;font-size:clamp(14px,1.8vw,24px);font-weight:900;max-width:100%}.gamePanel{display:flex;flex-direction:column;gap:8px;min-height:0;background:#ffffffe9;border:5px solid #fff;border-radius:32px;padding:clamp(12px,2vw,25px);box-shadow:0 12px 0 #3e9b9b55}.story{font-size:clamp(14px,1.8vw,23px);font-weight:800;color:#3c6075}.prompt{font-size:clamp(22px,3.3vw,44px);font-weight:1000;color:#234a7b;text-align:center}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1.5vw,20px);flex:1;min-height:0}.choice{background:linear-gradient(#fff,#effaff);border:5px solid white;border-radius:26px;box-shadow:0 7px #79b7c2;font-size:clamp(42px,10vh,100px);font-weight:1000;min-height:0;transition:transform .16s}.choice small{display:block;font-size:clamp(13px,1.6vw,21px);color:#326285}.choice:active{transform:scale(.94)}.choice.correct{background:#c8ffb5;border-color:#4ed47b;animation:yes .5s}.choice.wrong{background:#ffd8d8;border-color:#ff8c8c;animation:no .35s}@keyframes yes{50%{transform:scale(1.1)}}@keyframes no{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}.gameFooter{display:flex;align-items:center;justify-content:space-between;gap:12px}.feedback{font-weight:1000;font-size:clamp(14px,2vw,24px);min-width:120px;text-align:center}.meter{display:flex;gap:5px}.dot{width:clamp(12px,2vw,23px);height:clamp(12px,2vw,23px);border-radius:50%;background:#d2e3e8;border:2px solid #fff}.dot.done{background:#ffcd47}.finish{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}.finish h1{font-size:clamp(35px,6vw,70px);margin:0}.trophy{font-size:clamp(100px,20vw,220px);animation:bounce 1s infinite}.finish p{font-size:clamp(18px,2.5vw,29px);font-weight:900;margin:0}@media(max-height:450px){.top{padding:4px 12px}.gameBody{padding-bottom:5px}.gamePanel{padding:8px;gap:4px}.sideHero{font-size:85px}.bubble{padding:6px}.choice{font-size:45px}.btn{padding:6px 12px}.mapWrap{margin-bottom:5px}.node{height:60px;width:60px;font-size:27px}}
</style></head><body>
<section id="welcome" class="screen active"><div class="sky"></div><div class="cloud" style="top:7%">☁️</div><div class="cloud" style="top:22%">☁️</div><div class="top"><span class="logo">⚡ HEROQUEST ENGLISH</span><span class="pill">🌟 5.0</span></div><div class="heroSelect"><div class="mascot" id="bigHero">⚡</div><div class="welcome"><h1>¡La aventura te espera!</h1><p>Elige tu héroe y salva el Bosque de las Estrellas.</p><div class="heroes"><button class="heroBtn selected" onclick="pickHero(0,this)">⚡<small>King Bolt</small></button><button class="heroBtn" onclick="pickHero(1,this)">🚗<small>Turbo Max</small></button></div><p><button class="btn" onclick="openMap()">¡JUGAR! ▶</button></p></div></div></section>
<section id="map" class="screen"><div class="top"><button class="btn blue" onclick="show('welcome')">⌂ Inicio</button><span class="logo">🌳 BOSQUE DE LAS ESTRELLAS</span><span class="pill">⭐ <span class="stars">0</span></span></div><div class="mapWrap" id="mapWrap">
<svg class="mapArt" viewBox="0 0 1000 540" preserveAspectRatio="none"><defs><linearGradient id="water" x2="0" y2="1"><stop stop-color="#b9f7ff"/><stop offset="1" stop-color="#45bde4"/></linearGradient><radialGradient id="hill"><stop stop-color="#c8f49c"/><stop offset="1" stop-color="#7acb84"/></radialGradient></defs><rect width="1000" height="540" fill="url(#hill)"/><path d="M0 430 Q190 300 340 420 T650 400 T1000 350 L1000 540 H0Z" fill="#61b98b" opacity=".5"/><path class="river" d="M-30 485 C220 300 290 575 550 390 S800 480 1030 320" fill="none" stroke="#f3ffff" stroke-width="105"/><path d="M-30 485 C220 300 290 575 550 390 S800 480 1030 320" fill="none" stroke="url(#water)" stroke-width="86"/><g font-size="62" class="tree"><text x="50" y="100">🌲</text><text x="190" y="125">🌳</text><text x="360" y="75">🌲</text><text x="530" y="150">🌳</text><text x="700" y="80">🌲</text><text x="895" y="150">🌳</text><text x="935" y="440">🌲</text><text x="80" y="310">🌳</text></g><g font-size="32"><text x="440" y="455">🌷</text><text x="650" y="470">🌻</text><text x="770" y="350">🍄</text><text x="260" y="500">🌼</text><text x="825" y="510">🦋</text></g><path d="M110 410 C170 355 190 285 300 300 S450 420 510 290 S700 165 800 260 S915 190 910 85" fill="none" stroke="#9e7945" stroke-width="51" stroke-linecap="round"/><path d="M110 410 C170 355 190 285 300 300 S450 420 510 290 S700 165 800 260 S915 190 910 85" fill="none" stroke="#ffe6a2" stroke-width="38" stroke-linecap="round"/><path d="M110 410 C170 355 190 285 300 300 S450 420 510 290 S700 165 800 260 S915 190 910 85" fill="none" stroke="#fff7d4" stroke-width="3" stroke-dasharray="6 20"/></svg>
<div class="walker" id="walker">⚡</div>
<button class="node" style="left:11%;top:76%" onclick="visit(0)">🏡<small>Inicio</small></button>
<button class="node" style="left:30%;top:56%" onclick="visit(1)">🐶<small>Animales</small></button>
<button class="node" style="left:51%;top:54%" onclick="visit(2)">🌈<small>Colores</small></button>
<button class="node" style="left:70%;top:39%" onclick="visit(3)">🔢<small>Números</small></button>
<button class="node" style="left:81%;top:47%" onclick="visit(4)">🧩<small>Escucha</small></button>
<button class="node" style="left:91%;top:15%" onclick="visit(5)">🏰<small>Castillo</small></button>
<div class="mapLabel" id="mapHint">👆 ¡Toca Animales para comenzar!</div></div></section>
<section id="game" class="screen"><div class="sky"></div><div class="top"><button class="btn blue" onclick="openMap()">← Mapa</button><span class="logo" id="levelName">MISIÓN</span><span class="pill">⭐ <span class="stars">0</span></span></div><div class="gameBody"><div class="sidekick"><div class="sideHero" id="sideHero">⚡</div><div class="bubble" id="bubble">Let's play!</div></div><div class="gamePanel"><div class="story" id="story"></div><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div class="gameFooter"><button class="btn blue" onclick="speak(promptText)">🔊 Repetir</button><span class="feedback" id="feedback"></span><div class="meter" id="meter"></div></div></div></div></section>
<section id="finish" class="screen"><div class="sky"></div><div class="top"><span class="logo">🏆 ¡MISIÓN COMPLETADA!</span><span class="pill">⭐ <span class="stars">0</span></span></div><div class="finish"><div class="trophy">🏆✨</div><h1>AMAZING!</h1><p id="finishText">¡Has salvado a tus amigos!</p><button class="btn" onclick="openMap()">Seguir la aventura ➜</button></div></section>
<script>
'use strict';
const $=id=>document.getElementById(id);
const stages=[
{title:'El bosque perdido',story:'🐶 Los animales se han escondido. ¡Encuentra a sus amigos!',type:'animal'},
{title:'El arcoíris roto',story:'🌈 ¡Han desaparecido los colores! Ayuda a recuperarlos.',type:'color'},
{title:'El puente de números',story:'🔢 Necesitamos contar las estrellas para cruzar el puente.',type:'number'},
{title:'El mensaje secreto',story:'🧩 Escucha las pistas en inglés y descubre la respuesta.',type:'listen'},
{title:'El castillo mágico',story:'🏰 Mezcla todo lo aprendido para abrir el cofre final.',type:'mixed'}];
const animals=[['dog','🐶'],['cat','🐱'],['lion','🦁'],['elephant','🐘'],['bird','🐦'],['fish','🐟'],['rabbit','🐰'],['bear','🐻']];
const colors=[['red','🔴'],['blue','🔵'],['green','🟢'],['yellow','🟡'],['pink','🩷'],['orange','🟠']];
const numbers=[['one','⭐'],['two','⭐⭐'],['three','⭐⭐⭐'],['four','⭐⭐⭐⭐'],['five','⭐⭐⭐⭐⭐']];
const places=[[11,76],[30,56],[51,54],[70,39],[81,47],[91,15]];
let state={};try{state=JSON.parse(localStorage.getItem('heroquest-english-v5')||'{}')||{}}catch(e){}
let unlocked=Math.max(1,Math.min(5,Number(state.unlocked)||1)),stars=Math.max(0,Number(state.stars)||0),hero=0,level=0,round=0,question=null,promptText='',busy=false,serial=0,errors=0;
function save(){try{localStorage.setItem('heroquest-english-v5',JSON.stringify({unlocked,stars}))}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.id===id))}
function speak(t){try{if(window.AndroidVoice&&typeof window.AndroidVoice.speak==='function'){window.AndroidVoice.speak(t);return}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.8;u.pitch=1.06;speechSynthesis.speak(u)}}catch(e){}}
function pickHero(n,btn){hero=n;document.querySelectorAll('.heroBtn').forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');$('bigHero').textContent=hero?'🚗':'⚡';$('walker').textContent=hero?'🚗':'⚡';$('sideHero').textContent=hero?'🚗':'⚡'}
function update(){document.querySelectorAll('.stars').forEach(x=>x.textContent=stars);document.querySelectorAll('.node').forEach((n,i)=>{n.classList.toggle('locked',i>unlocked);n.setAttribute('aria-disabled',String(i>unlocked))})}
function openMap(){serial++;show('map');update()}
function visit(i){if(i===0){$('mapHint').textContent='🐶 ¡Empieza por la primera misión!';return}if(i>unlocked){$('mapHint').textContent='🔒 Completa primero la misión anterior';return}const s=++serial;const p=places[i];$('walker').classList.add('walking');$('walker').style.left=p[0]+'%';$('walker').style.top=p[1]+'%';$('mapHint').textContent='🚀 ¡En camino a la aventura!';setTimeout(()=>{if(s===serial){$('walker').classList.remove('walking');start(i-1)}},1550)}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(i){level=i;round=0;show('game');$('levelName').textContent=stages[i].title;$('story').textContent=stages[i].story;next()}
function makeQuestion(){let type=stages[level].type;if(type==='mixed')type=['animal','color','number','listen'][round%4];if(type==='listen')type=round%2?'animal':'color';let pool=type==='animal'?animals:type==='color'?colors:numbers;let target=pool[(round*3+level)%pool.length];let others=shuffle(pool.filter(x=>x[0]!==target[0])).slice(0,2);let options=shuffle([target,...others]);let spoken=type==='animal'?'Find the '+target[0]+'!':type==='color'?'Find '+target[0]+'!':'Count '+target[0]+' stars!';if(level===3)spoken='Listen carefully. '+spoken;if(level===4)spoken='Final challenge! '+spoken;return {target,options,spoken,type}}
function next(){busy=false;errors=0;$('feedback').textContent='';if(round>=5){win();return}question=makeQuestion();promptText=question.spoken;$('prompt').textContent=level===3?'👂 Listen carefully!':question.spoken;$('bubble').textContent=round===0?'Ready? Let’s go!':'You can do it!';$('meter').replaceChildren();for(let i=0;i<5;i++){let d=document.createElement('span');d.className='dot'+(i<round?' done':'');$('meter').append(d)}$('choices').replaceChildren();question.options.forEach(o=>{let b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',o[0]);if(question.type==='number'){b.style.fontSize='clamp(20px,3.7vw,45px)';b.textContent=o[1]}else b.textContent=o[1];b.onclick=()=>answer(o[0],b);$('choices').append(b)});let s=serial;setTimeout(()=>{if(s===serial&&$('game').classList.contains('active'))speak(promptText)},400)}
function burst(){let parent=$('game');for(let i=0;i<14;i++){let e=document.createElement('span');e.className='sparkle';e.textContent=['⭐','✨','💛'][i%3];e.style.left=(25+Math.random()*65)+'%';e.style.top=(35+Math.random()*45)+'%';parent.append(e);setTimeout(()=>e.remove(),1100)}}
function answer(word,b){if(busy)return;if(word!==question.target[0]){errors++;b.classList.add('wrong');$('feedback').textContent='💛 Try again!';$('bubble').textContent='Try again!';speak('Try again!');setTimeout(()=>b.classList.remove('wrong'),400);if(errors>=2){const right=[...$('choices').children].find(x=>x.getAttribute('aria-label')===question.target[0]);if(right)right.style.borderColor='#ffb92e'}return}busy=true;b.classList.add('correct');$('feedback').textContent='🌟 Great job!';$('bubble').textContent='Amazing! ⭐';$('sideHero').style.animationDuration='.35s';burst();speak('Great job!');let s=serial;setTimeout(()=>{if(s===serial){$('sideHero').style.animationDuration='2s';round++;next()}},1300)}
function win(){stars+=5;unlocked=Math.max(unlocked,Math.min(5,level+2));save();update();$('finishText').textContent=level===4?'¡Has salvado todo el Bosque de las Estrellas!':'¡Has conseguido 5 estrellas y desbloqueado una nueva misión!';show('finish');speak('Amazing! Well done!')}
update();
</script></body></html>
