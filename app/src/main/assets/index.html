<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Manu Kata Edu Adventure</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Trebuchet MS',system-ui,sans-serif;color:#30315c;background:#76dafa}button{border:0;font:inherit;font-weight:1000;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid white}.screen{display:none;width:100vw;height:100dvh;position:relative;overflow:hidden}.screen.on{display:flex;flex-direction:column}.sky{position:absolute;inset:0;background:linear-gradient(#6bcdfb 0%,#c8faff 56%,#81dca0 57%,#42bc8d 100%)}.cloud{position:absolute;font-size:70px;animation:drift 28s linear infinite;opacity:.8}@keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}.top{z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 15px;position:relative}.logo{color:#fff;text-shadow:0 3px #3659bd,0 6px 9px #214c9a;font-weight:1000;font-size:clamp(17px,3vw,35px)}.chip{background:#fff;border:3px solid #fff;border-radius:40px;padding:7px 15px;box-shadow:0 5px #3b83a677;font-size:clamp(13px,1.8vw,22px);font-weight:1000}.btn{background:linear-gradient(#fff2a0,#ffc432);color:#6b3c18;border:4px solid #fff;border-radius:24px;padding:9px 19px;box-shadow:0 7px #cc8630,0 10px 15px #4c548a44;font-size:clamp(16px,2vw,24px)}.btn:active{transform:translateY(5px);box-shadow:0 2px #cc8630}.btn.blue{background:linear-gradient(#e1ffff,#6ad7f6);box-shadow:0 6px #2b9dbb}.btn.pink{background:linear-gradient(#ffd6f6,#f589d9);box-shadow:0 6px #c04f9f}.intro{position:relative;flex:1;display:flex;justify-content:center;align-items:center;gap:2vw}.introPanel{background:#fffffff0;border:5px solid #fff;border-radius:35px;box-shadow:0 12px #428c9a66;text-align:center;padding:20px;max-width:50%;z-index:2}.introPanel h1{font-size:clamp(26px,4vw,54px);margin:5px;color:#f261b8;text-shadow:2px 3px #fff}.introPanel p{font-size:clamp(15px,2vw,23px);font-weight:900}.avatar{font-size:clamp(55px,11vw,150px);filter:drop-shadow(0 8px 3px #3b8e8780);animation:bob 2s ease-in-out infinite}.avatar:nth-child(2){animation-delay:-.6s}.avatar:nth-child(3){animation-delay:-1.2s}@keyframes bob{50%{transform:translateY(-13px) rotate(3deg)}}.menu{position:relative;display:flex;gap:12px;justify-content:center;flex-wrap:wrap;padding:8px 15px 18px}.menu button{background:#fff;border:4px solid #fff;border-radius:20px;padding:9px 18px;font-size:clamp(14px,1.9vw,23px);box-shadow:0 6px #4a8ab177}.map{position:relative;flex:1;min-height:0;margin:0 12px 12px;border:6px solid white;border-radius:32px;overflow:hidden;background:linear-gradient(130deg,#94efac,#6dcba0);box-shadow:0 9px 17px #32709a88}.map svg{position:absolute;width:100%;height:100%}.map .tree{animation:tree 3s ease-in-out infinite alternate;transform-origin:bottom;transform-box:fill-box}@keyframes tree{to{transform:rotate(3deg)}}.island{position:absolute;transform:translate(-50%,-50%);z-index:3;background:radial-gradient(circle at 30% 20%,#fff7be,#ffd25c);border:4px solid white;border-radius:50%;width:clamp(70px,9vw,118px);height:clamp(70px,9vw,118px);font-size:clamp(31px,4.6vw,58px);box-shadow:0 7px #b58a44;animation:bob 3s infinite}.island small{display:block;font-size:clamp(10px,1.2vw,15px)}.island.lock{filter:grayscale(.9);opacity:.65}.walker{position:absolute;left:10%;top:76%;z-index:4;transform:translate(-50%,-50%);font-size:clamp(44px,7vw,90px);transition:left 1.1s ease,top 1.1s ease;filter:drop-shadow(0 6px #43866b88)}.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#fff;border:3px solid #fff;border-radius:30px;padding:6px 15px;font-weight:1000;z-index:5;white-space:nowrap}.activity{position:relative;flex:1;min-height:0;display:flex;gap:14px;padding:0 16px 14px}.buddy{width:23%;display:flex;flex-direction:column;align-items:center;justify-content:center}.buddy .avatar{font-size:clamp(65px,12vw,165px)}.bubble{background:white;border:4px solid white;border-radius:22px;padding:10px;font-size:clamp(13px,1.7vw,22px);font-weight:900;text-align:center}.panel{background:#fffffff0;border:5px solid #fff;border-radius:30px;box-shadow:0 9px #439bb488;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:8px;padding:12px}.panel h2{margin:0;text-align:center;font-size:clamp(20px,3vw,37px)}.panel p{margin:0;text-align:center;font-weight:800;font-size:clamp(13px,1.6vw,21px)}.options{display:flex;justify-content:center;align-items:stretch;gap:12px;flex:1;width:100%;min-height:0}.option{flex:1;background:linear-gradient(#fff,#e5f8ff);border:5px solid white;border-radius:25px;font-size:clamp(50px,10vh,115px);box-shadow:0 6px #7db5c6}.option:active{transform:scale(.95)}.option.ok{background:#b7ffbb;border-color:#42d66b}.option.no{background:#ffd5d5;border-color:#ff8888}.controls{display:flex;justify-content:center;gap:12px;align-items:center;width:100%}.message{font-size:clamp(15px,2vw,25px);font-weight:1000;min-width:120px;text-align:center}.palette{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.swatch{width:clamp(34px,5vw,62px);height:clamp(34px,5vw,62px);border-radius:50%;border:5px solid #fff;box-shadow:0 4px #728ca0}.swatch.selected{outline:5px solid #ffc22e}.paintCanvas{width:min(100%,700px);height:48vh;min-height:130px;background:#fff;border:5px solid #b9e2f2;border-radius:20px;touch-action:none}.puzzleBoard{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:7px;width:min(100%,650px);height:48vh;min-height:140px}.tile{border:4px solid white;border-radius:16px;background:#fce5ff;box-shadow:0 4px #bda2d3;font-size:clamp(32px,8vh,85px)}.tile.selected{border-color:#ffae00;background:#fff0a9}.dragArea{display:flex;gap:20px;align-items:center;justify-content:center;flex:1;width:100%;min-height:0}.draggable,.dropzone{display:flex;align-items:center;justify-content:center;border:5px solid white;border-radius:25px;background:#e6faff;min-width:30%;height:80%;font-size:clamp(55px,12vh,120px);touch-action:none;user-select:none}.dropzone{background:#fff4bf;border:5px dashed #f6b83d}.dropzone.ok{background:#c3ffc4;border-style:solid}.reward{font-size:clamp(80px,17vw,180px);animation:bob 1.3s infinite}.spark{position:absolute;z-index:20;pointer-events:none;font-size:30px;animation:rise 1.2s forwards}@keyframes rise{to{transform:translateY(-100px) rotate(90deg);opacity:0}}@media(max-height:430px){.top{padding:3px 12px}.activity{padding-bottom:5px}.panel{padding:5px;gap:3px}.option{font-size:42px}.paintCanvas,.puzzleBoard{height:42vh}.btn{padding:5px 10px}.introPanel{padding:8px}.island{width:60px;height:60px;font-size:28px}}
</style></head><body>
<section id="home" class="screen on"><div class="sky"></div><div class="cloud" style="top:5%">☁️</div><div class="cloud" style="top:17%;animation-delay:-12s">☁️</div><header class="top"><span class="logo">🌟 MANU, KATA Y EDU</span><span class="chip">English Adventure</span></header><div class="intro"><div class="avatar">🦸🏻‍♂️</div><div class="introPanel"><h1>¡Una aventura increíble!</h1><p>Manu y Kata enseñan inglés al pequeño Edu. ¡Vamos a jugar!</p><button class="btn" onclick="openMap()">▶ ¡JUGAR!</button></div><div class="avatar">👧🏻</div><div class="avatar" style="font-size:clamp(42px,7vw,90px)">👶🏻</div></div><nav class="menu"><button onclick="launch('paint')">🎨 Pintar</button><button onclick="launch('puzzle')">🧩 Puzles</button><button onclick="launch('drag')">🖐️ Arrastrar</button><button onclick="launch('quiz')">🔊 Inglés</button></nav></section>
<section id="world" class="screen"><header class="top"><button class="btn blue" onclick="show('home')">⌂</button><span class="logo">🗺️ ISLAS DE LA AVENTURA</span><span class="chip">⭐ <span class="stars">0</span></span></header><div class="map"><svg viewBox="0 0 1000 540" preserveAspectRatio="none"><defs><linearGradient id="river" x2="0" y2="1"><stop stop-color="#bff8ff"/><stop offset="1" stop-color="#36b4ec"/></linearGradient></defs><rect width="1000" height="540" fill="#8fdda0"/><path d="M0 380 Q190 270 350 380 T720 330 T1000 340 V540 H0Z" fill="#61c6a4"/><path d="M-40 470 C170 290 300 560 520 365 S800 490 1040 260" stroke="#e8fcff" stroke-width="115" fill="none"/><path d="M-40 470 C170 290 300 560 520 365 S800 490 1040 260" stroke="url(#river)" stroke-width="95" fill="none"/><g font-size="65" class="tree"><text x="45" y="120">🌳</text><text x="180" y="90">🌲</text><text x="360" y="100">🌳</text><text x="580" y="110">🌲</text><text x="790" y="80">🌳</text><text x="900" y="440">🌲</text></g><path d="M100 405 C200 320 230 250 340 310 S480 400 550 260 S700 150 790 270 S900 180 920 85" fill="none" stroke="#b28651" stroke-width="54" stroke-linecap="round"/><path d="M100 405 C200 320 230 250 340 310 S480 400 550 260 S700 150 790 270 S900 180 920 85" fill="none" stroke="#ffe4a0" stroke-width="39" stroke-linecap="round"/><g font-size="36"><text x="230" y="460">🌸</text><text x="650" y="470">🌻</text><text x="720" y="360">🍄</text><text x="430" y="180">🦋</text></g></svg><div id="walker" class="walker">🦸🏻‍♂️</div><button class="island" style="left:10%;top:75%" onclick="visit(0)">🏠<small>Casa</small></button><button class="island" style="left:34%;top:57%" onclick="visit(1)">🐻<small>Animales</small></button><button class="island" style="left:55%;top:48%" onclick="visit(2)">🎨<small>Pintar</small></button><button class="island" style="left:79%;top:50%" onclick="visit(3)">🧩<small>Puzles</small></button><button class="island" style="left:92%;top:16%" onclick="visit(4)">🏰<small>Castillo</small></button><div id="mapHint" class="hint">👆 Elige una isla</div></div></section>
<section id="play" class="screen"><div class="sky"></div><header class="top"><button class="btn blue" onclick="openMap()">← Mapa</button><span class="logo" id="activityTitle">MISIÓN</span><span class="chip">⭐ <span class="stars">0</span></span></header><div class="activity"><aside class="buddy"><div class="avatar" id="guide">👧🏻</div><div class="bubble" id="bubble">Let's play!</div></aside><main class="panel" id="panel"></main></div></section>
<section id="finish" class="screen"><div class="sky"></div><header class="top"><span class="logo">🎉 ¡LO HAS CONSEGUIDO!</span><span class="chip">⭐ <span class="stars">0</span></span></header><div class="intro" style="flex-direction:column"><div class="reward">🏆🌟</div><div class="introPanel" style="max-width:85%"><h1>AMAZING!</h1><p>¡Manu, Kata y Edu están muy contentos!</p><button class="btn" onclick="openMap()">Otra aventura ➜</button></div></div></section>
<script>
'use strict';const $=id=>document.getElementById(id);let stars=0,level=0,round=0,correct='',phrase='',mode='quiz',busy=false,seq=0,selectedTile=-1,paintColor='#ff5252';try{stars=Number(localStorage.getItem('mke-stars')||0)||0}catch(e){}
const animals=[['dog','🐶'],['cat','🐱'],['lion','🦁'],['bear','🐻'],['fish','🐟'],['bird','🐦'],['rabbit','🐰'],['elephant','🐘']],colors=[['red','#ff4c55'],['blue','#3087ff'],['green','#35c978'],['yellow','#ffe044'],['pink','#ff78ce'],['orange','#ff983e']];
function save(){try{localStorage.setItem('mke-stars',String(stars))}catch(e){}}
function show(id){seq++;document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id))}
function say(t){try{if(window.AndroidVoice&&typeof window.AndroidVoice.speak==='function'){window.AndroidVoice.speak(t);return}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.78;speechSynthesis.speak(u)}}catch(e){}}
function update(){document.querySelectorAll('.stars').forEach(e=>e.textContent=stars)}
function openMap(){show('world');update()}
function visit(i){if(!i){show('home');return}const points=[[10,75],[34,57],[55,48],[79,50],[92,16]],p=points[i],s=++seq;$('walker').style.left=p[0]+'%';$('walker').style.top=p[1]+'%';$('mapHint').textContent='🚀 ¡Manu y Kata están de camino!';setTimeout(()=>{if(s===seq)launch(['','quiz','paint','puzzle','drag'][i])},1150)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function launch(m){mode=m;round=0;busy=false;show('play');$('guide').textContent=m==='paint'?'👧🏻':m==='puzzle'?'🦸🏻‍♂️':'👶🏻';$('activityTitle').textContent={paint:'🎨 TALLER DE KATA',puzzle:'🧩 PUZLES DE MANU',drag:'🖐️ AYUDA A EDU',quiz:'🐻 BOSQUE INGLÉS'}[m];next()}
function btn(t,fn,cl='btn'){let b=document.createElement('button');b.className=cl;b.textContent=t;b.onclick=fn;return b}
function heading(t){let h=document.createElement('h2');h.textContent=t;$('panel').append(h)}
function para(t){let p=document.createElement('p');p.textContent=t;$('panel').append(p)}
function controls(){let d=document.createElement('div');d.className='controls';$('panel').append(d);return d}
function next(){busy=false;$('panel').replaceChildren();if(round>=4){win();return}if(mode==='quiz')quiz();if(mode==='paint')paint();if(mode==='puzzle')puzzle();if(mode==='drag')drag()}
function win(){stars+=4;save();update();show('finish');say('Amazing! Well done!')}
function success(){if(busy)return;busy=true;$('bubble').textContent='Amazing! ⭐';say('Great job!');burst();let s=seq;setTimeout(()=>{if(s===seq){round++;next()}},1150)}
function burst(){for(let i=0;i<12;i++){let e=document.createElement('span');e.className='spark';e.textContent=i%2?'⭐':'✨';e.style.left=(30+Math.random()*60)+'%';e.style.top=(20+Math.random()*65)+'%';$('play').append(e);setTimeout(()=>e.remove(),1200)}}
function quiz(){let target=animals[(round*2+1)%animals.length];correct=target[0];phrase='Find the '+correct+'!';heading(phrase);para('Escucha a Edu y toca el animal correcto');let d=document.createElement('div');d.className='options';$('panel').append(d);shuffle([target,...shuffle(animals.filter(x=>x[0]!==correct)).slice(0,2)]).forEach(x=>{let b=btn(x[1],()=>{if(busy)return;if(x[0]===correct){b.classList.add('ok');success()}else{b.classList.add('no');$('bubble').textContent='Try again!';say('Try again!');setTimeout(()=>b.classList.remove('no'),400)}},'option');b.setAttribute('aria-label',x[0]);d.append(b)});controls().append(btn('🔊 Listen',()=>say(phrase),'btn blue'));say(phrase)}
function paint(){let target=colors[round%colors.length];paintColor=target[1];phrase='Paint with '+target[0]+'!';heading('🎨 '+phrase);para('Pinta el dibujo con el dedo y descubre los colores');let canvas=document.createElement('canvas');canvas.className='paintCanvas';canvas.width=700;canvas.height=330;$('panel').append(canvas);let ctx=canvas.getContext('2d');function base(){ctx.fillStyle='#fff';ctx.fillRect(0,0,700,330);ctx.lineWidth=8;ctx.lineCap='round';ctx.strokeStyle='#344a70';ctx.beginPath();ctx.arc(350,165,110,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(315,140,12,0,Math.PI*2);ctx.arc(385,140,12,0,Math.PI*2);ctx.fillStyle='#344a70';ctx.fill();ctx.beginPath();ctx.arc(350,190,35,0,Math.PI);ctx.stroke();ctx.font='75px system-ui';ctx.fillText('⭐',70,120);ctx.fillText('🌈',530,245)}base();let active=false,strokes=0;function point(ev){let r=canvas.getBoundingClientRect();return {x:(ev.clientX-r.left)*700/r.width,y:(ev.clientY-r.top)*330/r.height}}canvas.onpointerdown=e=>{active=true;canvas.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.strokeStyle=paintColor;ctx.lineWidth=22;ctx.stroke();strokes++};canvas.onpointermove=e=>{if(!active)return;let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke()};canvas.onpointerup=()=>active=false;canvas.onpointercancel=()=>active=false;let palette=document.createElement('div');palette.className='palette';$('panel').append(palette);colors.forEach(c=>{let b=document.createElement('button');b.className='swatch'+(c[0]===target[0]?' selected':'');b.style.background=c[1];b.setAttribute('aria-label',c[0]);b.onclick=()=>{paintColor=c[1];palette.querySelectorAll('button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');say(c[0])};palette.append(b)});let bar=controls();bar.append(btn('🔊 '+target[0],()=>say(phrase),'btn blue'));bar.append(btn('🧽 Borrar',base,'btn pink'));bar.append(btn('⭐ Terminado',()=>{if(strokes<2){$('bubble').textContent='¡Pinta un poquito más!';return}success()}));say(phrase)}
function puzzle(){const sets=[['🐶','🐱','🦁','🐻','🐰','🐼'],['🚗','🚀','🚁','🚂','🚲','🛴'],['🍎','🍌','🍓','🍇','🍊','🍉'],['⭐','🌈','☀️','🌙','☁️','🌻']];let original=sets[round],order=shuffle([0,1,2,3,4,5]);if(order.every((x,i)=>x===i))order.reverse();heading('🧩 Put the pictures in order!');para('Toca dos piezas para intercambiarlas y reconstruir la secuencia');let grid=document.createElement('div');grid.className='puzzleBoard';$('panel').append(grid);selectedTile=-1;function draw(){grid.replaceChildren();order.forEach((n,i)=>{let b=btn(original[n],()=>{if(selectedTile<0){selectedTile=i;draw();return}let a=selectedTile;selectedTile=-1;[order[a],order[i]]=[order[i],order[a]];draw();if(order.every((x,j)=>x===j))success()},'tile'+(i===selectedTile?' selected':''));grid.append(b)})}draw();let bar=controls();bar.append(btn('🔊 Listen',()=>say('Put the pictures in order!'),'btn blue'));bar.append(btn('👀 Pista',()=>{$('bubble').textContent='Orden: '+original.join(' ');say('Look carefully!')},'btn pink'));say('Put the pictures in order!')}
function drag(){let items=[['apple','🍎','🧺'],['ball','⚽','🥅'],['fish','🐟','🌊'],['car','🚗','🏠']];let it=items[round];phrase='Move the '+it[0]+'!';heading('🖐️ '+phrase);para('Arrastra el objeto hasta su destino. También puedes tocar ambos.');let area=document.createElement('div');area.className='dragArea';$('panel').append(area);let obj=document.createElement('div');obj.className='draggable';obj.textContent=it[1];obj.setAttribute('role','button');obj.setAttribute('aria-label',it[0]);obj.tabIndex=0;let target=document.createElement('div');target.className='dropzone';target.textContent=it[2];area.append(obj,target);let picked=false;function complete(){target.classList.add('ok');obj.textContent='✨';success()}obj.onclick=()=>{picked=true;obj.style.borderColor='#ffbc3e';$('bubble').textContent='Now tap the target!'};target.onclick=()=>{if(picked)complete()};obj.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();obj.click()}};obj.onpointerdown=e=>{if(e.pointerType==='mouse')return;obj.setPointerCapture(e.pointerId)};obj.onpointerup=e=>{if(e.pointerType==='mouse')return;let r=target.getBoundingClientRect();if(e.clientX>=r.left&&e.clientX<=r.right&&e.clientY>=r.top&&e.clientY<=r.bottom)complete()};controls().append(btn('🔊 Listen',()=>say(phrase),'btn blue'));say(phrase)}
update();
</script></body></html>
