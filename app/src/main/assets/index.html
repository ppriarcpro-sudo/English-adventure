<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HeroQuest English 4.1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Trebuchet MS',sans-serif;color:#243951;background:linear-gradient(140deg,#7cdcf6,#c9f9b8);overflow:hidden}button{font:inherit;cursor:pointer;touch-action:manipulation;border:0}button:focus-visible{outline:4px solid #246ef0}.screen{display:none;height:100dvh;padding:12px}.screen.active{display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:clamp(16px,2.5vw,26px);font-weight:900}.pill,.btn{background:#fff;border-radius:24px;padding:10px 16px;box-shadow:0 5px 0 #7aafbd88;font-weight:900}.btn{background:#ffce50}.intro{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;gap:10px}.intro h1{font-size:clamp(30px,5vw,60px);margin:0}.intro p{font-size:clamp(16px,2.4vw,24px);margin:5px}.heroes{display:flex;gap:20px}.heroChoice{font-size:clamp(52px,9vw,100px);background:#fff;border:5px solid transparent;border-radius:25px;padding:10px 20px}.heroChoice.selected{border-color:#f9b820}.heroChoice small{display:block;font-size:15px}.mapArea{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:28px;border:5px solid #fff;background:#8cd8a5}.mapArea svg{width:100%;height:100%;position:absolute;inset:0}.node{position:absolute;transform:translate(-50%,-50%);font-size:clamp(27px,5vw,56px);border:4px solid white;border-radius:50%;background:#fff3b3;width:clamp(68px,9vw,105px);height:clamp(68px,9vw,105px);box-shadow:0 6px 0 #4b8d6d;z-index:2}.node small{display:block;font-size:clamp(10px,1.4vw,15px);font-weight:900}.node.locked{filter:grayscale(.85);opacity:.65}.walker{position:absolute;left:11%;top:76%;transform:translate(-50%,-50%);font-size:clamp(36px,6vw,76px);z-index:3;pointer-events:none;transition:left 1s ease,top 1s ease;filter:drop-shadow(0 5px 3px #376c68)}.maphelp{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:#fffdf0;border-radius:20px;padding:7px 14px;font-weight:900;white-space:nowrap}.mission{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:9px;min-height:0;text-align:center}.story{background:#ffffffdf;border-radius:20px;padding:12px;font-size:clamp(15px,2.3vw,23px);font-weight:800}.prompt{font-size:clamp(22px,4vw,44px);font-weight:1000}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;flex:1;min-height:0;max-height:43vh}.choice{font-size:clamp(50px,11vh,110px);background:white;border-radius:25px;border:5px solid white;box-shadow:0 7px 0 #80b3ac}.choice.correct{background:#baffb7;border-color:#46c971}.choice.wrong{background:#ffd9d4;border-color:#fa9e92}.bottom{display:flex;justify-content:center;gap:20px;align-items:center}.toast{font-size:23px;font-weight:900;min-height:30px}.winEmoji{font-size:clamp(75px,16vw,170px)}@media(max-height:500px){.screen{padding:6px}.top{font-size:16px}.pill,.btn{padding:6px 12px}.story{padding:6px}.node{width:60px;height:60px;font-size:30px}.choices{max-height:40vh}.choice{font-size:55px}}
</style></head><body>
<section id="intro" class="screen active"><div class="top"><span>⭐ HEROQUEST ENGLISH</span><span class="pill">🦸 Aventura 4.1</span></div><div class="intro"><h1>¡Elige tu héroe!</h1><p>Ayuda a los animales del Bosque Mágico y aprende inglés.</p><div class="heroes"><button class="heroChoice selected" onclick="selectHero(0,this)">⚡<small>King Bolt</small></button><button class="heroChoice" onclick="selectHero(1,this)">🚗<small>Turbo Max</small></button></div><button class="btn" onclick="showMap()">¡JUGAR! ▶</button></div></section>
<section id="map" class="screen"><div class="top"><button class="btn" onclick="show('intro')">⌂</button><span>🗺️ BOSQUE MÁGICO</span><span class="pill">⭐ <span id="stars2">0</span></span></div><div class="mapArea"><svg viewBox="0 0 1000 540" preserveAspectRatio="none"><rect width="1000" height="540" fill="#8fdb9e"/><path d="M0 470 Q180 370 280 470 T550 400 T1000 460" stroke="#b6e0ff" stroke-width="95" fill="none"/><g font-size="65" opacity=".7"><text x="55" y="115">🌳</text><text x="300" y="95">🌲</text><text x="500" y="190">🌳</text><text x="800" y="110">🌲</text><text x="880" y="355">🌳</text></g><path d="M110 410 C170 370 190 280 300 300 S450 410 510 290 S700 170 800 260 S910 180 910 80" stroke="#a78b59" stroke-width="48" stroke-linecap="round" fill="none"/><path d="M110 410 C170 370 190 280 300 300 S450 410 510 290 S700 170 800 260 S910 180 910 80" stroke="#ffe6a3" stroke-width="34" stroke-linecap="round" fill="none"/></svg><div id="walker" class="walker">⚡</div>
<button class="node" style="left:11%;top:76%" onclick="goNode(0)">🏡<small>Inicio</small></button>
<button class="node" style="left:30%;top:56%" onclick="goNode(1)">🐶<small>Animales</small></button>
<button class="node" style="left:51%;top:54%" onclick="goNode(2)">🦁<small>Rescate</small></button>
<button class="node" style="left:70%;top:39%" onclick="goNode(3)">🐦<small>Amigos</small></button>
<button class="node" style="left:81%;top:47%" onclick="goNode(4)">🐠<small>Río</small></button>
<button class="node" style="left:91%;top:15%" onclick="goNode(5)">🏰<small>Castillo</small></button><div class="maphelp" id="maphelp">👆 Toca «Animales» para empezar</div></div></section>
<section id="game" class="screen"><div class="top"><button class="btn" onclick="showMap()">← Mapa</button><span id="levelTitle">MISIÓN</span><span class="pill">⭐ <span id="stars3">0</span></span></div><div class="mission"><div class="story" id="story"></div><div class="prompt" id="prompt">Find the dog!</div><div class="choices" id="choices"></div><div class="bottom"><button class="btn" onclick="say(currentPrompt)">🔊 Escuchar</button><span class="pill" id="progress">1 / 5</span></div><div class="toast" id="toast"></div></div></section>
<section id="win" class="screen"><div class="top"><span>🏆 ¡MISIÓN SUPERADA!</span><span class="pill">⭐ <span id="stars4">0</span></span></div><div class="intro"><div class="winEmoji">🏆🎉</div><h1>AMAZING!</h1><p>¡Has recuperado una estrella mágica!</p><button class="btn" onclick="showMap()">Seguir la aventura ➜</button></div></section>
<script>
'use strict';
const levels=[{title:'El comienzo',story:'¡Los animales necesitan ayuda! Escucha y encuentra a sus amigos.'},{title:'El cachorro perdido',story:'¡Un cachorro se ha escondido! Ayuda a encontrar a todos los animales.'},{title:'El rugido misterioso',story:'Un león busca a sus amigos. ¿Puedes ayudarle?'},{title:'La canción del bosque',story:'Los pájaros han olvidado sus nombres. ¡Vamos a recordarlos!'},{title:'El río encantado',story:'Los animales del río necesitan que les ayudes.'},{title:'El castillo de las estrellas',story:'¡Última misión! Recupera las estrellas del castillo.'}];
const words=[['dog','🐶'],['cat','🐱'],['lion','🦁'],['elephant','🐘'],['bird','🐦'],['fish','🐟'],['bear','🐻'],['rabbit','🐰']];
const points=[[11,76],[30,56],[51,54],[70,39],[81,47],[91,15]];
let hero=0,level=0,round=0,current=null,currentPrompt='',locked=false,session=0;
let saved={};try{saved=JSON.parse(localStorage.getItem('heroquest-english-v4')||'{}')||{}}catch(e){}
let unlocked=Math.max(1,Math.min(6,Number(saved.unlocked)||1)),stars=Math.max(0,Number(saved.stars)||0);
function save(){try{localStorage.setItem('heroquest-english-v4',JSON.stringify({unlocked,stars}))}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function say(t){try{if(window.AndroidVoice&&typeof window.AndroidVoice.speak==='function'){window.AndroidVoice.speak(t);return}if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.78;speechSynthesis.speak(u)}}catch(e){}}
function selectHero(n,b){hero=n;document.querySelectorAll('.heroChoice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');document.getElementById('walker').textContent=hero?'🚗':'⚡'}
function refresh(){['stars2','stars3','stars4'].forEach(id=>document.getElementById(id).textContent=stars);document.querySelectorAll('.node').forEach((b,i)=>{b.classList.toggle('locked',i>unlocked);b.setAttribute('aria-disabled',i>unlocked?'true':'false')})}
function showMap(){session++;show('map');refresh()}
function goNode(i){if(i===0){document.getElementById('maphelp').textContent='🐶 Toca Animales para comenzar';return}if(i>unlocked){document.getElementById('maphelp').textContent='🔒 Completa la fase anterior';say('Let us play the next level first!');return}const s=++session;const p=points[i];let w=document.getElementById('walker');w.style.left=p[0]+'%';w.style.top=p[1]+'%';document.getElementById('maphelp').textContent='🚶 ¡Vamos a la misión!';setTimeout(()=>{if(s===session)start(i-1)},1050)}
function start(i){level=i;round=0;show('game');document.getElementById('levelTitle').textContent=levels[i].title;document.getElementById('story').textContent=levels[i].story;next()}
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function next(){locked=false;document.getElementById('toast').textContent='';if(round===5){finish();return}current=words[(level*2+round)%words.length];currentPrompt='Find the '+current[0]+'!';document.getElementById('prompt').textContent=currentPrompt;document.getElementById('progress').textContent=(round+1)+' / 5';let options=shuffle([current,...shuffle(words.filter(x=>x[0]!==current[0])).slice(0,2)]);let box=document.getElementById('choices');box.replaceChildren();options.forEach(item=>{let b=document.createElement('button');b.className='choice';b.textContent=item[1];b.setAttribute('aria-label',item[0]);b.onclick=()=>answer(item[0],b);box.appendChild(b)});setTimeout(()=>{if(document.getElementById('game').classList.contains('active'))say(currentPrompt)},250)}
function answer(word,b){if(locked)return;if(word!==current[0]){b.classList.add('wrong');document.getElementById('toast').textContent='💛 Try again!';say('Try again!');setTimeout(()=>b.classList.remove('wrong'),550);return}locked=true;b.classList.add('correct');document.getElementById('toast').textContent='⭐ Great job!';say('Great job!');const s=session;setTimeout(()=>{if(s===session){round++;next()}},1050)}
function finish(){stars++;unlocked=Math.max(unlocked,Math.min(6,level+2));save();refresh();show('win');say('Amazing! Well done!')}
refresh();
</script></body></html>
